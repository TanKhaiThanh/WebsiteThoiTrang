# ==============================================
# ASMAW Fashion Website - Docker Compose
# ==============================================

services:
  # ============ INFRASTRUCTURE ============

  mysql:
    image: mysql:8.0
    container_name: asmaw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - asmaw-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: asmaw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - asmaw-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: hashicorp/consul:1.15
    container_name: asmaw-consul
    restart: unless-stopped
    ports:
      - "8500:8500"
    volumes:
      - ./consul/config.json:/consul/config/services.json
    command: agent -dev -client=0.0.0.0 -config-dir=/consul/config
    networks:
      - asmaw-network

  # ============ FRONTEND ============

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asmaw-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:${GATEWAY_PORT:-8000}/api
    networks:
      - asmaw-network
    depends_on:
      - api-gateway

  # ============ API GATEWAY ============

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: asmaw-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./backend/api-gateway:/var/www
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - CONSUL_HOST=${CONSUL_HOST}
      - CONSUL_PORT=${CONSUL_PORT}
      - USER_SERVICE_URL=http://user-service:8001
      - PRODUCT_SERVICE_URL=http://product-service:8002
      - ORDER_SERVICE_URL=http://order-service:8003
      - PROMOTION_SERVICE_URL=http://promotion-service:8004
    networks:
      - asmaw-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============ DOMAIN SERVICES ============

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: asmaw-user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT:-8001}:8001"
    volumes:
      - ./backend/user-service:/var/www
    environment:
      - APP_NAME=UserService
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_USER_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - asmaw-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    container_name: asmaw-product-service
    restart: unless-stopped
    ports:
      - "${PRODUCT_SERVICE_PORT:-8002}:8002"
    volumes:
      - ./backend/product-service:/var/www
      - media_uploads:/var/www/storage/app/public/uploads
    environment:
      - APP_NAME=ProductService
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_PRODUCT_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - asmaw-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: asmaw-order-service
    restart: unless-stopped
    ports:
      - "${ORDER_SERVICE_PORT:-8003}:8003"
    volumes:
      - ./backend/order-service:/var/www
    environment:
      - APP_NAME=OrderService
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_ORDER_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - PRODUCT_SERVICE_URL=http://product-service:8002
      - USER_SERVICE_URL=http://user-service:8001
      - PROMOTION_SERVICE_URL=http://promotion-service:8004
    networks:
      - asmaw-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  promotion-service:
    build:
      context: ./backend/promotion-service
      dockerfile: Dockerfile
    container_name: asmaw-promotion-service
    restart: unless-stopped
    ports:
      - "${PROMOTION_SERVICE_PORT:-8004}:8004"
    volumes:
      - ./backend/promotion-service:/var/www
    environment:
      - APP_NAME=PromotionService
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_PROMO_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - asmaw-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

# ============ VOLUMES ============
volumes:
  mysql_data:
  redis_data:
  media_uploads:

    # ============ NETWORKS ============
networks:
  asmaw-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
